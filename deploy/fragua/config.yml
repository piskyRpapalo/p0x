# Tunel del Agora · la-fragua. Se copia a ~/.cloudflared/config.yml
#
# `originRequest.noTLSVerify` NO hace falta y no esta: el origen es HTTP en
# loopback, no HTTPS con certificado propio. Ponerlo «por si acaso» seria
# apagar una comprobacion que aqui no se usa.
#
# La regla `catch-all` del final es obligatoria en cloudflared y ademas es la
# que decide que pasa con cualquier host que apunte aqui por error: un 404,
# no el Agora. Sin ella, un hostname mal configurado serviria esta API.
tunnel: agora
credentials-file: /home/ubuntu/.cloudflared/bbe3c9be-06b9-4fb6-b368-2cebe65f1dbe.json   # guardia:permitir ruta del nodo de destino; cloudflared no admite ~ aqui

ingress:
  - hostname: api.preceptoros.org
    service: http://127.0.0.1:9002
  - service: http_status:404
