# PROPUESTO · NO INSTALADO. Firma el Soberano.
#
# Destino: ~/.config/systemd/user/preceptoros-pwa.service.d/10-motor-vulkan.conf
# Instalar:  install -Dm644 deploy/soberano/preceptoros-pwa.service.d-10-motor-vulkan.conf \
#              ~/.config/systemd/user/preceptoros-pwa.service.d/10-motor-vulkan.conf
#            systemctl --user daemon-reload && systemctl --user restart preceptoros-pwa.service
# Revertir:  rm ~/.config/systemd/user/preceptoros-pwa.service.d/10-motor-vulkan.conf
#            systemctl --user daemon-reload && systemctl --user restart preceptoros-pwa.service
#
# QUE CAMBIA: el motor del turno pasa del binario CPU del PATH al envoltorio
# Vulkan. Nada mas. Mismo modelo (el 4B del producto), misma memoria, mismo
# puerto, misma unidad.
#
# POR QUE NO SE INSTALA SOLO: `preceptoros-pwa.service` esta FIRMADA (unidades.md,
# 2026-08-25) y sirve la cara permanentemente. Cambiarle el motor por debajo es
# modificar algo que ya corre con autoridad -- y la regla del canon del
# 2026-08-24 pide firma explicita para cada unidad, una por una.
#
# GANANCIA MEDIDA (2026-08-25, mismo prompt, -n 80, el 4B del producto):
#   CPU     19,23 tok/s · 6,2 s de pared por turno
#   Vulkan  27,25 tok/s · 3,9 s de pared por turno   (x1,42 · -37 % de espera)

[Service]
Environment=PRECEPTOROS_MOTOR=%h/.local/bin/preceptoros-motor-vulkan
