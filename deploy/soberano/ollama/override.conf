# Drop-in para ollama.service · PROPUESTA, sin aplicar. Firma del Soberano.
#
# EL PROBLEMA, MEDIDO EL 2026-08-31
# ---------------------------------
# El servicio corre como usuario `ollama` (HOME=/usr/share/ollama), asi que
# lee /usr/share/ollama/.ollama/models. Ese almacen mide 60K: esta vacio, y
# por eso `ollama list` no devuelve nada. Los modelos reales --33 GB-- viven
# en /home/pisky/.ollama/models, que ya pertenece a ollama:ollama.  guardia:permitir ruta literal
#
# POR QUE ESTA RUTA Y NO LA DEL PADRE
# -----------------------------------
# OLLAMA_MODELS apunta al directorio que contiene `blobs` y `manifests`, no a
# su padre. Comprobado: /home/pisky/.ollama/models/ contiene los dos.  guardia:permitir ruta literal
# Apuntar a /home/pisky/.ollama deja al demonio buscando un `models/models`.  guardia:permitir ruta literal
[Service]
Environment="OLLAMA_MODELS=/home/pisky/.ollama/models"  # guardia:permitir un drop-in de systemd exige la ruta literal
