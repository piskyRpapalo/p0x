<!doctype html>
<meta charset="utf-8">
<title>El Búnker · Ojo del Soberano</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/bunker.css">
<header class="cabecera">
  <h1>EL BÚNKER</h1>
  <p class="sub">Los siete bucles del árbol. Lo que ves es lo que <em>loops.db</em> y
     las unidades de systemd miden ahora mismo — no una maqueta. Pulsa una sala.</p>
  <p class="pulso" id="pulso">leyendo el rack…</p>
</header>

<!-- El pozo: una sala por bucle, apiladas. Es la forma del mockup y también la
     del rack: se baja por el hueco, no se recorre un plano. -->
<main id="pozo" class="pozo" aria-live="polite"></main>

<!-- La ficha de servicio. Vive fuera del pozo para que abrirla no mueva las
     salas: una ficha que empuja el suelo bajo el personaje que acabas de pulsar
     es una ficha que te hace perder de vista lo que ibas a leer. -->
<aside id="ficha" class="ficha" hidden>
  <button class="cerrar" id="cerrar" aria-label="Cerrar la ficha">×</button>
  <div id="ficha-cuerpo"></div>
</aside>

<footer class="pie">
  <span id="fuente">—</span>
</footer>
<script src="/bunker.js"></script>
