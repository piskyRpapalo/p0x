# ============================================================================
# teaching_kernel.yaml — Sweller/Kapur como reglas de estado DURAS
# Misión LAS TRES JOYAS (2026-07-19). Compartido por P0X y Aurelius: un nodo
# que se conoce (monje/genesis.py) y se enseña (este kernel), construido una
# vez. El Jardín es el espacio donde este kernel florece.
#
# NOTA DE PROCEDENCIA: estos cuatro principios entran a la vez como reglas
# operables Y como primeras entradas con procedencia sólida del corpus de
# psicología pendiente (MAPA §F2: "la mecánica se deriva, no se decreta").
# Origen: externo-fuente-academica (Sweller; Kapur) — dato, no autoridad:
# canoniza el Soberano.
# ============================================================================

teaching_kernel:
  version: "1.0.0"
  origen: externo-fuente-academica

  # Sweller, J. (1988): Cognitive Load Theory — la carga cognitiva transitoria
  # de una operación irreversible inminente satura la memoria de trabajo; la
  # simulación determinista previa la convierte en carga germane (esquema).
  # Toda operación de escritura/borrado/flash EXIGE dry-run antes. Sin
  # excepción: la regla es de estado, no de estilo.
  dry_run_obligatorio: true

  # Kapur, M. (2008): Productive Failure — el fallo bien andamiado prepara el
  # aprendizaje mejor que la instrucción directa. Un error JAMÁS se presenta
  # como estado terminal binario ("failed"): se presenta como vector de
  # diagnóstico con siguiente-paso accionable.
  fallo_como_ramificacion: true

  # Contramedida al Transient Information Effect (Sweller/Chandler: la
  # información que desaparece no construye esquema). El objetivo macro
  # (North Star State) permanece VISIBLE durante toda la sesión — conecta
  # con la ley del nodo de no perder el tracking del trabajo.
  ancla_objetivo_macro: true

  # Retrieval practice (Roediger & Karpicke 2006) + fading del andamiaje
  # (Wood, Bruner & Ross 1976; Collins/Brown/Newman): la ayuda que no decae
  # cría dependencia, no soberanía. La verbosidad de la asistencia decae
  # inversamente a la competencia demostrada (no declarada) del usuario.
  scaffolding_fading:
    activo: true
    metrica: competencia_demostrada
