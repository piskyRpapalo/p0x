# ============================================================================
# PROPUESTA · nginx en LA FRAGUA (Orange Pi) · proxy inverso de descargas
#
# PROPOSE-ONLY. Este nodo (soberano) no toca la-fragua por canon: se entrega el
# artefacto y lo aplica el carbono con sudo. Nada de aqui se ha ejecutado.
#
# Fecha: 2026-09-06
#
# QUE PROBLEMA RESUELVE, Y POR QUE NO SE ARREGLA EN CLOUDFLARE
# ------------------------------------------------------------
# Los GGUF pesan 55 MB. Cloudflare Pages corta en 25 MB por fichero, asi que
# hoy `https://preceptoros.org/downloads/preceptor-tribune-en-v1.gguf` devuelve
# 404 mientras su `.sha256` --que son 65 bytes-- devuelve 200. Se publicaba el
# hash de un fichero que no se podia bajar.
#
# La salida no es subir el limite: es no pasar por Pages. Con `downloads.
# preceptoros.org` en DNS only (nube gris) el trafico va a la IP de la Fragua
# sin atravesar el proxy de Cloudflare, y ahi no hay tope de 25 MB porque no
# hay Cloudflare en medio.
#
# LA CADENA COMPLETA
#   Internet -> la-fragua:80 (esto) -> Tailscale -> soberano IP_TAILNET_SOBERANO:8081  # guardia:permitir la cadena de saltos ES lo que esta propuesta propone
#                                                   -> /home/pisky/p0x/  # guardia:permitir la ruta servida ES el contenido
#                                                      preceptoros-web/public/
#                                                      downloads/
#
# LA IP VA COMO MARCADOR, Y NO ES PEREZA
# --------------------------------------
# Donde pone `IP_TAILNET_SOBERANO` va la IP de tailscale del Beelink. No se
# escribe aqui porque el guardian de higiene de este repo tiene `IP-TAILNET` en
# su suelo duro --`D8_JAMAS`--, que ninguna decision firmada puede eximir: una
# IP de la red superpuesta no entra al arbol, y forzarlo con `--no-verify` seria
# saltarse una regla que existe justo para esto.
#
# Sale mejor asi de todas formas: una IP de tailnet puede cambiar al reinstalar
# un nodo, y un fichero que la lleva cocida envejece en silencio. El paso 0 de
# abajo la obtiene del propio Soberano y la sustituye de una pasada.
#
# TRES COSAS QUE HAY QUE SABER ANTES DE PEGAR ESTO
# ------------------------------------------------
# 1 · VA EN HTTP PLANO, y se dice en vez de callarlo. Nube gris significa que
#     Cloudflare NO pone el certificado, y la Fragua hoy no tiene uno para este
#     nombre. La descarga viaja sin cifrar: quien este en medio ve QUE te bajas
#     --no hay secreto que proteger, el catalogo es publico-- y podria alterar
#     el fichero. Contra eso sirve exactamente el `.sha256` que se publica al
#     lado, y por eso el README dice que sin hash no se instala nada. Cuando
#     haya certbot en la Fragua, este mismo bloque gana su 443 y esta nota se
#     borra.
#
# 2 · DEPENDE DE QUE EL BEELINK ESTE ENCENDIDO. La Fragua no aloja los ficheros,
#     los reenvia. Si el Soberano se apaga o se cae de la tailnet, esto devuelve
#     502. Es un proxy, no una replica -- y conviene saberlo antes de anunciar
#     la URL a un tester.
#
# 3 · LA FRAGUA TIENE QUE VER LA TAILNET. `tailscale status` en la Fragua debe
#     listar al soberano, y `curl -sI http://IP_TAILNET_SOBERANO:8081/downloads/` debe
#     dar 200 DESDE LA FRAGUA antes de tocar nginx. Si eso falla, el problema no
#     esta en este fichero y esta configuracion solo lo disfrazara de 502.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name downloads.preceptoros.org;

    # El nombre del sitio en los registros, para no mezclarlo con el resto de
    # lo que sirva la Fragua: una descarga rota se busca en su propio fichero.
    access_log /var/log/nginx/downloads.access.log;  # guardia:permitir ruta de log de nginx, no del home
    error_log  /var/log/nginx/downloads.error.log;  # guardia:permitir ruta de log de nginx, no del home

    # Sin esto, nginx anuncia su version exacta en cada respuesta. No es un
    # secreto, pero tampoco es informacion que un servidor de ficheros publicos
    # tenga que regalar.
    server_tokens off;

    location /downloads/ {
        # LAS DOS BARRAS FINALES IMPORTAN Y NO SON ADORNO. Con barra en el
        # `location` Y en el `proxy_pass`, nginx sustituye el prefijo en vez de
        # concatenarlo: /downloads/x.gguf -> /downloads/x.gguf. Si se le quita
        # la del `proxy_pass`, pide /downloads/downloads/x.gguf y da 404 -- y
        # es el fallo mas comun de esta configuracion.
        proxy_pass http://IP_TAILNET_SOBERANO:8081/downloads/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- LOS 55 MB, QUE ES TODO EL MOTIVO DE ESTE FICHERO ---------------
        # Por defecto nginx se BAJA ENTERA la respuesta del backend antes de
        # empezar a darsela al cliente, y lo que no le cabe en memoria lo
        # escribe en disco. En una Orange Pi eso son 55 MB de escritura en la
        # tarjeta por cada descarga, y el cliente mirando una barra parada.
        # Apagado, nginx reenvia mientras recibe: el tester ve avanzar la barra
        # desde el primer segundo y la tarjeta no sufre.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        # Una conexion lenta con 55 MB tarda. Los 60 s por defecto cortan la
        # descarga a media y el fichero llega truncado -- que es peor que no
        # llegar, porque parece un fichero. Diez minutos dan margen hasta a una
        # linea mala.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;

        # Que el navegador no se guarde un GGUF de 55 MB para siempre: cinco
        # minutos bastan para reintentar sin volver a cruzar la tailnet, y no
        # dejan una version vieja pegada cuando se publique la siguiente. Es la
        # misma leccion que costo el `Content-Disposition` cacheado 365 dias.
        add_header Cache-Control "public, max-age=300" always;
    }

    # Cualquier otra ruta no existe aqui. Un 404 seco es mas honesto que un
    # listado del sistema de ficheros o una pagina prestada de otro sitio.
    location / {
        return 404;
    }
}

# ============================================================================
# COMO SE APLICA, EN LA FRAGUA Y CON SUDO
# ============================================================================
#
#   # EL USUARIO DE LA FRAGUA ES `ubuntu`, no `pisky` ni `root`. Lo dice
#   # `~/.ssh/config` --`Host la-fragua` con `User ubuntu`-- y se escribe aqui
#   # porque quien pegue esto va a estar en OTRA maquina: si lo hace desde una
#   # sesion de `pisky` y no se fija, `~` no es el que cree. Todo lo que este
#   # fichero manda ejecutar va con `sudo` sobre `/etc/nginx`, asi que el home
#   # no entra en juego -- pero la conexion si:
#   #     ssh la-fragua        # ya resuelve el usuario por el config  # guardia:permitir el comando de conexion ES la instruccion
#
#   # 0a · La IP del Soberano, dicha por el propio Soberano. En EL BEELINK:
#   tailscale ip -4
#
#   # 0b · En LA FRAGUA: que la vea, y que responda. Si esto no da 200, para
#   #      aqui -- nginx no lo va a arreglar, solo lo disfrazara de 502.
#   IP_SOB=<lo que dijo el paso 0a>
#   tailscale status | grep -i soberano
#   curl -sI "http://$IP_SOB:8081/downloads/" | head -3
#
#   # 1 · Guardar este fichero (pegado tal cual, sin los comentarios de esta
#   #     seccion si se prefiere).
#   sudo tee /etc/nginx/sites-available/downloads.preceptoros.org.conf > /dev/null
#
#   # 1b · Y se le pone la IP real, que es lo unico que este fichero no trae.
#   sudo sed -i "s/IP_TAILNET_SOBERANO/$IP_SOB/g" \
#            /etc/nginx/sites-available/downloads.preceptoros.org.conf
#   grep proxy_pass /etc/nginx/sites-available/downloads.preceptoros.org.conf
#
#   # 2 · Habilitarlo.
#   sudo ln -sfn /etc/nginx/sites-available/downloads.preceptoros.org.conf \
#                /etc/nginx/sites-enabled/downloads.preceptoros.org.conf
#
#   # 3 · Probar la sintaxis ANTES de recargar. `nginx -t` es la diferencia
#   #     entre un error en pantalla y un servidor caido.
#   sudo nginx -t
#
#   # 4 · Recargar. `reload` y no `restart`: no corta las conexiones vivas.
#   sudo systemctl reload nginx
#
# ============================================================================
# COMO SE COMPRUEBA QUE FUNCIONA (y no que "deberia")
# ============================================================================
#
#   # Desde CUALQUIER maquina fuera del rack:
#   curl -sI http://downloads.preceptoros.org/downloads/preceptor-tribune-en-v1.gguf
#   # Se espera: 200, y un Content-Length de ~57.500.000 bytes.
#
#   # La prueba de verdad es bajarlo entero y comprobar el hash, que es lo que
#   # el README manda hacer a quien lo instale:
#   curl -sO http://downloads.preceptoros.org/downloads/preceptor-tribune-en-v1.gguf
#   curl -s  http://downloads.preceptoros.org/downloads/preceptor-tribune-en-v1.gguf.sha256
#   sha256sum -c preceptor-tribune-en-v1.gguf.sha256
#
# ============================================================================
# Y EL PASO QUE FALTA DESPUES, QUE NO ES DE NGINX
# ============================================================================
#
# Con esto en verde, y SOLO entonces, se devuelve el boton a la web:
# `preceptoros-web/public/loratelier.json`, bloque `reclamaciones` -- estado a
# `beta` otra vez y `artefacto` de vuelta, con `url_descarga` apuntando al
# nombre nuevo y absoluto:
#
#   "url_descarga": "http://downloads.preceptoros.org/downloads/preceptor-tribune-en-v1.gguf"
#
# Hoy ese bloque esta en `en_entrenamiento` con `artefacto: null` justamente
# para que no pinte un boton hacia el 404. Sin artefacto no hay boton: el orden
# es servir primero y prometer despues, nunca al reves.
