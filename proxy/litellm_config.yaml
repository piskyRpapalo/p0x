# Proxy P0X — LiteLLM (OpenAI-compatible) · una API delante de los dos nodos Ollama.
# interactivo -> la-torre (Orin Nano, qwen3:4b) ; batch/embeddings -> la-fragua (RK3588, CPU)
# Failover REAL (no balanceo): si la-torre cae, "interactivo" degrada a la-fragua.
# Tailnet: la-torre 100.101.96.13 · la-fragua 100.82.94.83 · Ollama :11434

model_list:
  - model_name: interactivo            # lazo del Preceptor + voces del Sinodo (rapido, CUDA)
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://100.101.96.13:11434

  - model_name: batch                  # procesar corpus, razonar deltas (lento, CPU)
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://100.82.94.83:11434

  - model_name: embeddings             # RAG -> Qdrant
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://100.82.94.83:11434

router_settings:
  fallbacks:
    - interactivo: ["batch"]           # la-torre cae -> CPU de la-fragua (lento pero vivo)
  num_retries: 1
  timeout: 120
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  turn_off_message_logging: true       # soberania del dato: sin telemetria externa

general_settings:
  # Escucha en el tailnet, no en 0.0.0.0 (ver banderas de higiene de la-fragua).
  # Arranque: litellm --config litellm_config.yaml --host <tailnet-ip> --port 4000
